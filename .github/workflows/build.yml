name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build
        run: pyinstaller --clean --noconfirm --onefile --windowed --name GERADOR_RAIO_X app.py
      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\XLSM | Out-Null
          New-Item -ItemType Directory -Force package\PDF | Out-Null
          Copy-Item dist\GERADOR_RAIO_X.exe package\GERADOR_RAIO_X.exe
          Copy-Item config.json package\config.json
          Copy-Item README.md package\README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GERADOR_RAIO_X_portatil
          path: package\
